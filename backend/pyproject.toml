[project]
name = "zenvora-backend"
version = "0.1.0"
description = "Zenvora API — modular monolith backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.4.0",
    "fastapi[standard]>=0.116",
    "pydantic-settings>=2.10",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.0.40",
    "uvicorn[standard]>=0.35",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "ruff>=0.12",
]

[tool.uv]
package = false

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
